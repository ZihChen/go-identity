# 建構 Docker 映像
build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - apk add --no-cache aws-cli jq      # 安裝 AWS CLI
    - aws sts get-caller-identity        # 檢查當前身份
    # 登入 AWS ECR
    - |
      echo "Assuming role for ECR access..."
      creds=$(aws sts assume-role \
                --role-arn arn:aws:iam::REDACTED_AWS_ACCOUNT_DEMO:role/FatcatInternalRunnerAssumeRole \
                --role-session-name "ciBuild-${CI_PIPELINE_ID}" \
                --output json)
      if [ $? -ne 0 ]; then
        echo "Failed to assume role"
        exit 1
      fi
      export AWS_ACCESS_KEY_ID=$(echo "$creds" | jq -r '.Credentials.AccessKeyId')
      export AWS_SECRET_ACCESS_KEY=$(echo "$creds" | jq -r '.Credentials.SecretAccessKey')
      export AWS_SESSION_TOKEN=$(echo "$creds" | jq -r '.Credentials.SessionToken')
      echo "Successfully assumed role, verifying identity..."
      aws sts get-caller-identity --query 'Arn' --output text
    # Docker login
    - |
      echo "Logging into ECR..."
      aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

  script:
    - docker buildx create --use       # 設置 Docker Buildx
    - docker buildx build --push --platform linux/amd64 --build-arg TARGETOS=linux --build-arg TARGETARCH=amd64 --build-arg CI_COMMIT_SHA=${CI_COMMIT_SHA} -t ${ECR_REPO}/fatidentitycat:latest .
  only:
    - main
    - dev




