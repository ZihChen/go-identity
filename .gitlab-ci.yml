stages:
  - lint
  - test
  - build

# 定義一個通用的清理腳本
.cleanup_script: &cleanup_script |
  docker system prune -af
  rm -rf /tmp/* || true
  rm -rf /var/lib/apt/lists/*
  rm -rf /root/.cache
  rm -rf $(go env GOCACHE) || true
  go clean -cache || true
  go clean -testcache || true

variables:
  AWS_REGION: "ap-northeast-1"
  ECR_REGISTRY: "REDACTED_AWS_ACCOUNT_DEMO.dkr.ecr.${AWS_REGION}.amazonaws.com"
  ECR_REPO: "${ECR_REGISTRY}/quantumcat"
# Golang-lint 檢查
lint:
  stage: lint
  image: golangci/golangci-lint:latest
  before_script:
    - df -h
    - apt-get update
    - apt-get install -y docker.io
    - *cleanup_script
    - df -h
  script:
    - golangci-lint run
  only:
    - dev
    - merge_requests
# 單元測試
unit-tests:
  stage: test
  image: golang:1.24
  before_script:
    - df -h
    - apt-get update
    - apt-get install -y docker.io
    - *cleanup_script
    - df -h
  script:
    - go test -v ./internal/... || exit 1
    - mkdir -p reports
    - go test -v ./internal/... || exit 1
    - go test -coverprofile=reports/coverage.out ./internal/...
    - |
      if [ -f reports/coverage.out ]; then
        coverage=$(go tool cover -func=reports/coverage.out | grep total | awk '{print $3}' | sed 's/%//' | awk '{print int($1)}')
        echo "測試覆蓋率：$coverage%"
      else
      echo "No coverage report generated"
      exit 1
      fi
  only:
    - dev
# 建構 Docker 映像
build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - apk add --no-cache aws-cli jq      # 安裝 AWS CLI
    - aws sts get-caller-identity        # 檢查當前身份
    # 登入 AWS ECR
    - |
      echo "Assuming role for ECR access..."
      creds=$(aws sts assume-role \
                --role-arn arn:aws:iam::REDACTED_AWS_ACCOUNT_DEMO:role/FatcatInternalRunnerAssumeRole \
                --role-session-name "ciBuild-${CI_PIPELINE_ID}" \
                --output json)
      if [ $? -ne 0 ]; then
        echo "Failed to assume role"
        exit 1
      fi
      export AWS_ACCESS_KEY_ID=$(echo "$creds" | jq -r '.Credentials.AccessKeyId')
      export AWS_SECRET_ACCESS_KEY=$(echo "$creds" | jq -r '.Credentials.SecretAccessKey')
      export AWS_SESSION_TOKEN=$(echo "$creds" | jq -r '.Credentials.SessionToken')
      echo "Successfully assumed role, verifying identity..."
      aws sts get-caller-identity --query 'Arn' --output text
    # Docker login
    - |
      echo "Logging into ECR..."
      aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

  script:
    - |
      # 設置 Docker Buildx
      docker buildx create --use

      # 輸出當前的 Git 信息，用於調試
      echo "Current commit SHA: ${CI_COMMIT_SHA}"
      echo "Current tag: ${CI_COMMIT_TAG}"
      
      # 檢查是否有 tag（使用 git 命令作為備選方案）
      GIT_TAG=$(git describe --tags --exact-match 2>/dev/null || echo "")
      echo "Git tag from command: ${GIT_TAG}"

      
      
      # 構建基本標籤列表
      TAGS="-t ${ECR_REPO}/fatidentitycat:latest -t ${ECR_REPO}/fatidentitycat:${CI_COMMIT_SHA}"

      # 優先使用 CI_COMMIT_TAG，如果沒有則使用 git command 獲取的 tag
      if [ -n "${CI_COMMIT_TAG}" ]; then
        echo "使用 CI_COMMIT_TAG: ${CI_COMMIT_TAG}"
        TAGS="$TAGS -t ${ECR_REPO}/fatidentitycat:${CI_COMMIT_TAG}"
      elif [ -n "${GIT_TAG}" ]; then
        echo "使用 Git command tag: ${GIT_TAG}"
        TAGS="$TAGS -t ${ECR_REPO}/fatidentitycat:${GIT_TAG}"
      fi


      # 執行構建和推送
      docker buildx build --push \
        --platform linux/amd64 \
        --build-arg TARGETOS=linux \
        --build-arg TARGETARCH=amd64 \
        --build-arg CI_COMMIT_SHA=${CI_COMMIT_SHA} \
        ${TAGS} \
        .
  only:
    - dev



