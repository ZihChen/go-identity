include:
  - component: gitlab.jvdtech.dev/fatcat/infracat/ai-review@main

default:
  image: golang:1.25-alpine
  tags:
    - docker-executor

stages:
  - ai-review
  - lint
  - test
  - build
  - deploy

# ============================================
# Templates
# ============================================
.build-quantumcat-template:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  variables:
    AWS_DEFAULT_REGION: ap-northeast-1
    ECR_REPOSITORY: REDACTED_AWS_ACCOUNT_DEMO.dkr.ecr.ap-northeast-1.amazonaws.com/quantumcat/fatidentitycat
  script:
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile" \
        --destination "${ECR_REPOSITORY}:latest" \
        --destination "${ECR_REPOSITORY}:${CI_COMMIT_SHA}" \
        --build-arg APP_VERSION=${CI_COMMIT_SHORT_SHA} \
        --build-arg CI_COMMIT_SHA=${CI_COMMIT_SHA} \
        --custom-platform=linux/amd64

.deploy-template:
  stage: deploy
  image: alpine:latest
  variables:
    AWS_REGION: ap-northeast-1
    EKS_CLUSTER_NAME: quantumcat-dev-001
  before_script:
    - apk add --no-cache aws-cli kubectl
    - aws eks update-kubeconfig --name ${EKS_CLUSTER_NAME} --region ${AWS_REGION}
    - aws sts get-caller-identity
  script:
    - kubectl rollout restart deployment/${DEPLOY_NAME}-web -n ${NAMESPACE}
    - kubectl rollout restart deployment/${DEPLOY_NAME}-consumer -n ${NAMESPACE}
    - kubectl rollout restart deployment/${DEPLOY_NAME}-worker -n ${NAMESPACE}

# ============================================
# Lint Check
# ============================================
lint-check:
  tags:
    - macmini-designer
  stage: lint
  timeout: 15 minutes
  variables:
    GOPATH: ${CI_PROJECT_DIR}/.cache/go
    GOCACHE: ${CI_PROJECT_DIR}/.cache/go-build
    GOBIN: ${CI_PROJECT_DIR}/.cache/go/bin
  cache:
    - key:
        files:
          - go.sum
        prefix: "lint-${CI_JOB_IMAGE}-${CI_RUNNER_EXECUTABLE_ARCH}"
      paths:
        - .cache/go/pkg/mod
      policy: pull-push
      when: always
    - key: "lint-tools-${CI_JOB_IMAGE}-${CI_RUNNER_EXECUTABLE_ARCH}"
      paths:
        - .cache/go/bin
      policy: pull-push
      when: always
  before_script:
    - apk add --no-cache git
    - export PATH="${GOBIN}:${PATH}"
    - command -v golangci-lint || go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0
  script:
    - golangci-lint run ./...
    - go build ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev"

# ============================================
# Test
# ============================================
go-test:
  tags:
    - macmini-designer
  stage: test
  timeout: 20 minutes
  variables:
    GOPATH: ${CI_PROJECT_DIR}/.cache/go
    GOCACHE: ${CI_PROJECT_DIR}/.cache/go-build
    GOBIN: ${CI_PROJECT_DIR}/.cache/go/bin
  cache:
    - key:
        files:
          - go.sum
        prefix: "test-${CI_JOB_IMAGE}-${CI_RUNNER_EXECUTABLE_ARCH}"
      paths:
        - .cache/go/pkg/mod
        - .cache/go-build
      policy: pull-push
      when: always
  before_script:
    - apk add --no-cache gcc musl-dev
  script:
    - CGO_ENABLED=1 go test -race -timeout 300s -coverprofile=coverage.out ./internal/...
    - go tool cover -func=coverage.out
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev"

# ============================================
# Build
# ============================================
build:
  extends: .build-quantumcat-template
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

# ============================================
# Deploy
# ============================================
deploy-dev:
  extends: .deploy-template
  variables:
    DEPLOY_NAME: fatidentitycat
    NAMESPACE: bonuscat
  needs: [build]
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
