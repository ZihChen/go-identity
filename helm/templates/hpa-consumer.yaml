{{- if .Values.consumer.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "fatidentitycat.fullname" . }}-consumer
  labels:
    {{- include "fatidentitycat.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "fatidentitycat.fullname" . }}-consumer
  minReplicas: {{ .Values.consumer.hpa.minReplicas }}
  maxReplicas: {{ .Values.consumer.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.consumer.hpa.targetCPUUtilizationPercentage | default 65 }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
      - type: Pods
        value: 2
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
      - type: Percent
        value: 25
        periodSeconds: 120
{{- end }}
