{{- /* 合併環境變數的字典 */ -}}
{{- $mergedEnv := dict }}

{{- /* 基礎環境變數 (來自 values.yaml) */ -}}
{{- if .Values.env }}
{{- $mergedEnv = merge $mergedEnv .Values.env }}
{{- end }}

{{- /* 根據全局環境載入額外配置 */ -}}
{{- if eq .Values.global.environment "development" }}
{{- /* 從 values-demo.yaml 載入額外的演示環境配置 */ -}}
{{- $demoValues := (.Files.Get "values-demo.yaml" | fromYaml) }}
{{- if and $demoValues $demoValues.env }}
{{- $mergedEnv = merge $mergedEnv $demoValues.env }}
{{- end }}
{{- else if eq .Values.global.environment "production" }}
{{- /* 從 values-pro.yaml 載入額外的生產環境配置 */ -}}
{{- $prodValues := (.Files.Get "values-pro.yaml" | fromYaml) }}
{{- if and $prodValues $prodValues.env }}
{{- $mergedEnv = merge $mergedEnv $prodValues.env }}
{{- end }}
{{- end }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fatidentitycat.fullname" . }}
  labels:
    {{- include "fatidentitycat.labels" . | nindent 4 }}
data:
{{- if $mergedEnv }}
{{- toYaml $mergedEnv | nindent 2 }}
{{- end }}
