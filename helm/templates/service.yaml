apiVersion: v1
kind: Service
metadata:
  name: {{ include "fatidentitycat.fullname" . }}
  labels:
    {{- include "fatidentitycat.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    {{- include "fatidentitycat.labels" . | nindent 4 }}
