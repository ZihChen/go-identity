definitions:
  api.ErrorResponse:
    properties:
      error:
        example: An error occurred
        type: string
    type: object
  api.Manager:
    type: object
  api.Merchant:
    type: object
  api.Player:
    type: object
  api.SuccessResponse:
    properties:
      status:
        example: success
        type: string
    type: object
  dto.PlayerLoginRequest:
    type: object
  dto.PlayerLoginResponse:
    properties:
      jwt_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      success:
        example: true
        type: boolean
    type: object
host: localhost:8080
info:
  contact:
    email: support@jvdiamondtech.com
    name: API Support
    url: http://www.jvdiamondtech.com/support
  description: 用於管理商戶、玩家和管理員的身份服務
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Identity Service API
  version: "1.0"
paths:
  /api/v1/managers/{id}:
    get:
      consumes:
      - application/json
      description: 根據管理員ID獲取管理員信息
      parameters:
      - description: 管理員ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Manager'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: 通過ID獲取管理員
      tags:
      - 管理員
  /api/v1/managers/global/{global_id}:
    get:
      consumes:
      - application/json
      description: 根據管理員全局ID獲取管理員信息
      parameters:
      - description: 管理員全局ID
        in: path
        name: global_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Manager'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: 通過全局ID獲取管理員
      tags:
      - 管理員
  /api/v1/merchants/{id}:
    get:
      consumes:
      - application/json
      description: 根據商戶ID獲取商戶信息
      parameters:
      - description: 商戶ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Merchant'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: 通過ID獲取商戶
      tags:
      - 商戶
  /api/v1/merchants/global/{global_id}:
    get:
      consumes:
      - application/json
      description: 根據商戶全局ID獲取商戶信息
      parameters:
      - description: 商戶全局ID
        in: path
        name: global_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Merchant'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: 通過全局ID獲取商戶
      tags:
      - 商戶
  /api/v1/players/{id}:
    get:
      consumes:
      - application/json
      description: 根據玩家ID獲取玩家信息
      parameters:
      - description: 玩家ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Player'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: 通過ID獲取玩家
      tags:
      - 玩家
  /api/v1/players/{id}/active:
    put:
      consumes:
      - application/json
      description: 將玩家的最後活躍時間更新為當前時間
      parameters:
      - description: 玩家ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: 更新玩家最後活躍時間
      tags:
      - 玩家
  /api/v1/players/global/{global_id}:
    get:
      consumes:
      - application/json
      description: 根據玩家全局ID獲取玩家信息
      parameters:
      - description: 玩家全局ID
        in: path
        name: global_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Player'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: 通過全局ID獲取玩家
      tags:
      - 玩家
  /api/v1/players/login:
    post:
      consumes:
      - application/json
      description: |-
        玩家登入 API。只驗證 global_merchant_id 與 API-Key 是否匹配，不查詢資料庫。metadata 中的資料會被加密到 JWT token 中。

        請求參數說明：
        - global_merchant_id: (必填) 商戶全局 ID，必須與 API-Key 對應的 merchant ID 一致
        - metadata: (必填) 任意 JSON 物件，請求方可自行決定包含的資料，完整內容會被加密到 JWT token 中

        範例 metadata:
        ```json
        {
        "player_id": "883",
        "username": "winston",
        "custom_field": "any value"
        }
        ```
      parameters:
      - description: 登入請求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.PlayerLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功生成 JWT token
          schema:
            $ref: '#/definitions/dto.PlayerLoginResponse'
        "400":
          description: 請求格式錯誤或 metadata 為空
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: 缺少 API-Key 認證
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: global_merchant_id 與 API-Key 不匹配
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: JWT token 生成失敗
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: 玩家登入並生成 JWT token
      tags:
      - 玩家
  /api/v1/test/kds:
    post:
      consumes:
      - application/json
      description: 發送代理同步測試事件到KDS
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: 發送KDS測試事件
      tags:
      - 測試
  /health:
    get:
      description: 檢查服務是否正常運行
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: 健康檢查
      tags:
      - 系統
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: API-Key
    type: apiKey
swagger: "2.0"
