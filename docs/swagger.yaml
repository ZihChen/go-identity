definitions:
  handler.ErrorResponse:
    properties:
      error:
        example: An error occurred
        type: string
    type: object
  handler.Manager:
    properties:
      account:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      email:
        type: string
      global_manager_id:
        type: string
      id:
        type: integer
      merchant_id:
        type: integer
      updated_at:
        type: string
    type: object
  handler.Merchant:
    properties:
      api_key:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      display_name:
        type: string
      global_merchant_id:
        type: string
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
    type: object
  handler.Player:
    properties:
      account:
        type: string
      api_key:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      email:
        type: string
      global_player_id:
        type: string
      id:
        type: integer
      last_active_at:
        type: string
      merchant_id:
        type: integer
      updated_at:
        type: string
    type: object
  handler.SuccessResponse:
    properties:
      status:
        example: success
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@jvdiamondtech.com
    name: API Support
    url: http://www.jvdiamondtech.com/support
  description: 用於管理商戶、玩家和管理員的身份服務
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Identity Service API
  version: "1.0"
paths:
  /api/v1/managers/{id}:
    get:
      consumes:
      - application/json
      description: 根據管理員ID獲取管理員信息
      parameters:
      - description: 管理員ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Manager'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: 通過ID獲取管理員
      tags:
      - 管理員
  /api/v1/managers/global/{global_id}:
    get:
      consumes:
      - application/json
      description: 根據管理員全局ID獲取管理員信息
      parameters:
      - description: 管理員全局ID
        in: path
        name: global_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Manager'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: 通過全局ID獲取管理員
      tags:
      - 管理員
  /api/v1/merchants/{id}:
    get:
      consumes:
      - application/json
      description: 根據商戶ID獲取商戶信息
      parameters:
      - description: 商戶ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Merchant'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: 通過ID獲取商戶
      tags:
      - 商戶
  /api/v1/merchants/global/{global_id}:
    get:
      consumes:
      - application/json
      description: 根據商戶全局ID獲取商戶信息
      parameters:
      - description: 商戶全局ID
        in: path
        name: global_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Merchant'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: 通過全局ID獲取商戶
      tags:
      - 商戶
  /api/v1/players/{id}:
    get:
      consumes:
      - application/json
      description: 根據玩家ID獲取玩家信息
      parameters:
      - description: 玩家ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Player'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: 通過ID獲取玩家
      tags:
      - 玩家
  /api/v1/players/{id}/active:
    put:
      consumes:
      - application/json
      description: 將玩家的最後活躍時間更新為當前時間
      parameters:
      - description: 玩家ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: 更新玩家最後活躍時間
      tags:
      - 玩家
  /api/v1/players/global/{global_id}:
    get:
      consumes:
      - application/json
      description: 根據玩家全局ID獲取玩家信息
      parameters:
      - description: 玩家全局ID
        in: path
        name: global_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Player'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: 通過全局ID獲取玩家
      tags:
      - 玩家
  /health:
    get:
      description: 檢查服務是否正常運行
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
      summary: 健康檢查
      tags:
      - 系統
swagger: "2.0"
