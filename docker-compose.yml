services:
  fat-identity-redis:
    image: redis:7.2-alpine
    container_name: fat-identity-redis
    ports:
      - "6379:6379"
    volumes:
      - identity_redis_data:/data
    networks:
      - fatcatnet
    restart: always
  fat-identity-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fat-identity-web
    entrypoint: [
      "dlv",
      "--listen=:6380",
      "--headless=true",
      "--api-version=2",
      "--accept-multiclient",
      "exec",
      "./fat-identity-cat",
      "--",
      "web"
    ]
    environment:
      - TZ=Asia/Taipei
    ports:
      - "8080:8080"
      - "6380:6380"   #debugger接口
      - "6060:6060"
    security_opt:
      - "seccomp=unconfined"
    cap_add:
      - SYS_PTRACE
    depends_on:
      - fat-identity-redis
    networks:
      - fatcatnet
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.identity.rule=Host(`identity.localhost`)"
      - "traefik.http.routers.identity.entrypoints=web"
      - "traefik.http.services.identity.loadbalancer.server.port=8080"
  fat-identity-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fat-identity-consumer
    entrypoint: [
      "dlv",
      "--listen=:6381",
      "--headless=true",
      "--api-version=2",
      "--accept-multiclient",
      "exec",
      "./fat-identity-cat",
      "--",
      "consumer"
    ]
    environment:
      - TZ=Asia/Taipei
    ports:
      - "6381:6381"   #debugger接口
    security_opt:
      - "seccomp=unconfined"
    cap_add:
      - SYS_PTRACE
    depends_on:
      - fat-identity-redis
    networks:
      - fatcatnet
    restart: always
  fat-identity-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fat-identity-worker
    entrypoint: [
      "dlv",
      "--listen=:6382",
      "--headless=true",
      "--api-version=2",
      "--accept-multiclient",
      "exec",
      "./fat-identity-cat",
      "--",
      "worker"
    ]
    environment:
      - TZ=Asia/Taipei
    ports:
      - "6382:6382"   #debugger接口
    depends_on:
      - fat-identity-redis
    networks:
      - fatcatnet
    restart: always

volumes:
  identity_redis_data:

networks:
  fatcatnet:
    external: true